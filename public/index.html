<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🔗 URL Shortener</h1>
            <p class="subtitle">Transform long URLs into short, shareable links</p>
        </header>

        <main class="main">
            <!-- URL Shortening Form -->
            <section class="shorten-section">
                <form id="shortenForm" class="shorten-form">
                    <div class="form-group">
                        <label for="originalUrl" class="form-label">Enter your long URL</label>
                        <input
                            type="url"
                            id="originalUrl"
                            name="url"
                            class="form-input"
                            placeholder="https://example.com/very/long/url/that/needs/shortening"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="customCode" class="form-label">Custom short code (optional)</label>
                        <input
                            type="text"
                            id="customCode"
                            name="customCode"
                            class="form-input"
                            placeholder="e.g., mylink (4-10 characters)"
                            maxlength="10"
                            pattern="[a-zA-Z0-9]{4,10}"
                        >
                        <small class="form-help">Leave empty for auto-generated code</small>
                    </div>

                    <button type="submit" class="btn btn-primary" id="shortenBtn">
                        <span class="btn-text">Shorten URL</span>
                        <span class="btn-loading" style="display: none;">Creating...</span>
                    </button>
                </form>

                <!-- Error Message -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Success Result -->
                <div id="resultSection" class="result-section" style="display: none;">
                    <div class="result-card">
                        <h3 class="result-title">✅ Short URL Created!</h3>
                        <div class="result-urls">
                            <div class="url-group">
                                <label class="url-label">Original URL:</label>
                                <a id="originalUrlResult" class="url-link original" href="" target="_blank" rel="noopener"></a>
                            </div>
                            <div class="url-group">
                                <label class="url-label">Short URL:</label>
                                <div class="short-url-container">
                                    <a id="shortUrlResult" class="url-link short" href="" target="_blank" rel="noopener"></a>
                                    <button class="btn btn-copy" onclick="copyToClipboard()">📋 Copy</button>
                                </div>
                            </div>
                        </div>
                        <div class="result-actions">
                            <button class="btn btn-secondary" onclick="viewStats()">📊 View Stats</button>
                            <button class="btn btn-secondary" onclick="shortenAnother()">🔗 Shorten Another</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- URL Statistics -->
            <section id="statsSection" class="stats-section" style="display: none;">
                <div class="stats-card">
                    <h3 class="stats-title">📊 URL Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Short Code:</span>
                            <span id="statsShortCode" class="stat-value"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Created:</span>
                            <span id="statsCreated" class="stat-value"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Total Clicks:</span>
                            <span id="statsClicks" class="stat-value"></span>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="hideStats()">← Back</button>
                </div>
            </section>

            <!-- Recent URLs -->
            <section class="recent-section">
                <h3 class="section-title">📋 Recent URLs</h3>
                <div id="recentUrls" class="recent-urls">
                    <!-- Recent URLs will be loaded here -->
                </div>
                <button id="loadMoreBtn" class="btn btn-secondary" onclick="loadRecentUrls()">Load Recent URLs</button>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2024 URL Shortener | Built with Node.js & SQLite</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
