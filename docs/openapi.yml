                          title: Product Page
                          shortCode: def456
                          clicks: 18
                          timestamp: "2024-01-15T09:45:00Z"
                      clickTrend:
                        - date: "2024-01-15"
                          clicks: 234
                        - date: "2024-01-14"
                          clicks: 298
                        - date: "2024-01-13"
                          clicks: 456

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          minLength: 8
          description: User's password (minimum 8 characters)
        name:
          type: string
          minLength: 2
          description: User's full name
        organization:
          type: string
          description: User's organization (optional)
      example:
        email: john.doe@example.com
        password: SecurePassword123!
        name: John Doe
        organization: Acme Corp

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: User's password
      example:
        email: john.doe@example.com
        password: SecurePassword123!

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token
      example:
        refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CreateUrlRequest:
      type: object
      required:
        - originalUrl
      properties:
        originalUrl:
          type: string
          format: uri
          description: The original URL to shorten
        title:
          type: string
          description: Optional title for the URL
        customSlug:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 3
          maxLength: 50
          description: Optional custom short code
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration date
        tags:
          type: array
          items:
            type: string
          description: Optional tags for categorization
      example:
        originalUrl: https://www.example.com/very/long/url/path
        title: Example Website
        customSlug: example
        expiresAt: "2024-12-31T23:59:59Z"
        tags: [web, example]

    UpdateUrlRequest:
      type: object
      properties:
        title:
          type: string
          description: URL title
        tags:
          type: array
          items:
            type: string
          description: URL tags
        expiresAt:
          type: string
          format: date-time
          description: Expiration date (null to remove expiration)
        isActive:
          type: boolean
          description: Whether the URL is active
      example:
        title: Updated Title
        tags: [updated, example]
        isActive: true

    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User's email
        name:
          type: string
          description: User's name
        organization:
          type: string
          description: User's organization
        createdAt:
          type: string
          format: date-time
          description: Account creation date
      example:
        id: 123
        email: john.doe@example.com
        name: John Doe
        organization: Acme Corp
        createdAt: "2024-01-15T10:30:00Z"

    Url:
      type: object
      properties:
        id:
          type: integer
          description: URL ID
        originalUrl:
          type: string
          format: uri
          description: Original URL
        shortUrl:
          type: string
          format: uri
          description: Complete short URL
        shortCode:
          type: string
          description: Short code only
        title:
          type: string
          description: URL title
        clicks:
          type: integer
          description: Total number of clicks
        isActive:
          type: boolean
          description: Whether the URL is active
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration date
        createdAt:
          type: string
          format: date-time
          description: Creation date
        updatedAt:
          type: string
          format: date-time
          description: Last update date
        tags:
          type: array
          items:
            type: string
          description: URL tags
      example:
        id: 456
        originalUrl: https://www.example.com/page
        shortUrl: https://short.ly/abc123
        shortCode: abc123
        title: Example Page
        clicks: 142
        isActive: true
        expiresAt: null
        createdAt: "2024-01-15T10:30:00Z"
        updatedAt: "2024-01-15T10:30:00Z"
        tags: [example, web]

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          description: Current page number
        totalPages:
          type: integer
          description: Total number of pages
        totalItems:
          type: integer
          description: Total number of items
        itemsPerPage:
          type: integer
          description: Items per page
        hasNext:
          type: boolean
          description: Whether there is a next page
        hasPrev:
          type: boolean
          description: Whether there is a previous page
      example:
        currentPage: 1
        totalPages: 5
        totalItems: 95
        itemsPerPage: 20
        hasNext: true
        hasPrev: false

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                expiresIn:
                  type: integer
                  description: Token expiration time in seconds
      example:
        success: true
        message: Authentication successful
        data:
          user:
            id: 123
            email: john.doe@example.com
            name: John Doe
          tokens:
            accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expiresIn: 3600

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
              description: Token expiration time in seconds
      example:
        success: true
        message: Token refreshed successfully
        data:
          accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          expiresIn: 3600

    UrlResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Url'
      example:
        success: true
        message: URL retrieved successfully
        data:
          id: 456
          originalUrl: https://www.example.com/page
          shortUrl: https://short.ly/abc123
          shortCode: abc123
          title: Example Page
          clicks: 142

    UrlListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            urls:
              type: array
              items:
                $ref: '#/components/schemas/Url'
            pagination:
              $ref: '#/components/schemas/Pagination'

    AnalyticsResponse:
      type: object
