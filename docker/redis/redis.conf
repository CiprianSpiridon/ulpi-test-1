# =============================================================================
# Enterprise URL Shortener - Redis Configuration
# =============================================================================
# Optimized for caching and session storage with security hardening.
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------

# Bind to all interfaces inside the Docker network (access restricted via
# Docker networking; do NOT expose port 6379 to the host in production).
bind 0.0.0.0

# Default Redis port
port 6379

# Close idle connections after 300 seconds (5 minutes)
timeout 300

# TCP keepalive to detect dead peers (in seconds)
tcp-keepalive 60

# Maximum number of simultaneous client connections
maxclients 10000

# Disable protected mode since we use password auth + Docker network isolation
protected-mode no

# -----------------------------------------------------------------------------
# SECURITY
# -----------------------------------------------------------------------------

# Require password authentication (overridden by REDIS_PASSWORD env var in
# docker-compose via the command-line --requirepass flag, but set here as a
# fallback).
requirepass changeme_redis_password

# Rename dangerous commands to prevent accidental or malicious use
rename-command FLUSHDB "_INTERNAL_FLUSHDB"
rename-command FLUSHALL "_INTERNAL_FLUSHALL"
rename-command DEBUG ""
rename-command CONFIG "_INTERNAL_CONFIG"

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT
# -----------------------------------------------------------------------------

# Maximum memory limit (adjust based on available host memory)
maxmemory 256mb

# Eviction policy: remove least-recently-used keys that have an expiry set.
# This is ideal for a cache layer -- keys with TTL are evicted first, while
# persistent keys (e.g., rate-limit counters) without TTL are preserved.
maxmemory-policy allkeys-lru

# Number of keys to sample when running eviction algorithms
maxmemory-samples 10

# -----------------------------------------------------------------------------
# PERSISTENCE (AOF + RDB)
# -----------------------------------------------------------------------------
# Use both AOF and RDB for durability. AOF provides point-in-time recovery,
# RDB provides compact snapshots for faster restarts.

# --- RDB Snapshots ---
# Save after 900s if at least 1 key changed
# Save after 300s if at least 10 keys changed
# Save after 60s if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

# Stop accepting writes if RDB snapshot fails (data safety)
stop-writes-on-bgsave-error yes

# Compress RDB snapshots
rdbcompression yes

# Enable RDB checksum verification
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# --- AOF (Append-Only File) ---
appendonly yes

# Filename for AOF
appendfilename "appendonly.aof"

# Fsync policy: everysec is a good balance of performance and durability
# (at most 1 second of data loss on crash)
appendfsync everysec

# Don't fsync during rewrite (improves performance during compaction)
no-appendfsync-on-rewrite no

# Trigger AOF rewrite when AOF file is 100% larger than after last rewrite
auto-aof-rewrite-percentage 100

# Minimum AOF file size before auto-rewrite kicks in
auto-aof-rewrite-min-size 64mb

# -----------------------------------------------------------------------------
# DATA DIRECTORY
# -----------------------------------------------------------------------------

dir /data

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Log level: debug, verbose, notice, warning
loglevel notice

# Log to stdout (Docker captures via logging driver)
logfile ""

# -----------------------------------------------------------------------------
# SLOW LOG
# -----------------------------------------------------------------------------

# Log queries slower than 10ms (in microseconds)
slowlog-log-slower-than 10000

# Keep last 128 slow queries
slowlog-max-len 128

# -----------------------------------------------------------------------------
# LATENCY MONITORING
# -----------------------------------------------------------------------------

# Track operations taking longer than 5ms
latency-monitor-threshold 5

# -----------------------------------------------------------------------------
# KEY EXPIRY NOTIFICATIONS
# -----------------------------------------------------------------------------

# Enable keyspace notifications for expired keys.
# This allows the application to listen for session expiry events.
# K = Keyspace events
# Ex = Expired events
notify-keyspace-events "KEx"

# -----------------------------------------------------------------------------
# LUA SCRIPTING
# -----------------------------------------------------------------------------

# Maximum execution time for Lua scripts (ms)
lua-time-limit 5000

# -----------------------------------------------------------------------------
# ACTIVE DEFRAGMENTATION
# -----------------------------------------------------------------------------

# Enable active defragmentation to reduce memory fragmentation
activedefrag yes
active-defrag-enabled yes
